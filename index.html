<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workshop Dock — каталог модов Steam</title>
<link rel="stylesheet" href="/style.css">
<script defer src="/app.js"></script>
</head>
<body>
<header><div class="wrap top"><a class="brand" href="/"><span aria-hidden="true">⬡</span> Workshop Dock</a><a id="queue-link" href="#download-queue" hidden>Очередь загрузок</a><span class="source">Steam Workshop</span></div></header>
<main class="wrap">
<section class="hero">
<p class="label">КАТАЛОГ МОДИФИКАЦИЙ</p>
<h1>Моды из<br><em>Steam Workshop</em></h1>
<p>Найдите мод для своей игры или откройте его по ссылке. Для просмотра аккаунт Steam не нужен.</p>
<form id="lookup">
<label for="link">Ссылка на мод или Workshop ID</label>
<div class="row"><input id="link" required placeholder="Например, 818773962" autocomplete="off"><button>Открыть мод</button></div>
<div id="lookup-status" class="status" role="status"></div>
</form>
</section>
<section id="download-folder" aria-label="Настройки загрузки" hidden>
<div class="row"><button id="choose-folder" class="secondary">Выбрать папку для ZIP</button><span id="folder-path" class="status" role="status"></span></div>
</section>
<section id="download-queue" aria-labelledby="queue-title" hidden>
<h2 id="queue-title">Очередь загрузок</h2>
<p id="queue-notice" class="status" role="status"></p>
<ol id="queue-items"></ol>
</section>
<section class="catalog" aria-labelledby="catalog-title">
<h2 id="catalog-title" tabindex="-1">Каталог</h2>
<form class="filters" id="filters">
<label>Игра<select id="game"><option value="233860">Kenshi</option><option value="294100">RimWorld</option><option value="108600">Project Zomboid</option><option value="322330">Don't Starve Together</option><option value="4000">Garry’s Mod</option><option value="255710">Cities: Skylines</option><option value="286160">Tabletop Simulator</option><option value="custom">Другая игра</option></select></label>
<label id="custom-label" hidden>Steam App ID<input id="custom" inputmode="numeric" pattern="[1-9][0-9]{0,9}" placeholder="App ID" disabled></label>
<label class="search">Поиск по названию<input id="search" type="search" maxlength="120" placeholder="Поиск в мастерской"></label>
<label>Сортировка<select id="sort"><option value="toprated">Самые популярные за всё время</option><option value="trend">Популярные сейчас</option><option value="mostrecent">Новые</option><option value="totaluniquesubscribers">По подписчикам</option></select></label>
<button>Найти</button>
</form>
<p id="catalog-status" class="status" role="status"></p>
<div id="results" class="grid"></div>
<nav id="pagination" aria-label="Страницы каталога" hidden>
<p id="page" role="status"></p>
<div class="page-controls">
<button id="prev" class="secondary">Назад</button>
<div id="page-numbers" class="page-controls"></div>
<button id="next" class="secondary">Дальше</button>
</div>
</nav>
</section>
</main>
<dialog id="item-dialog">
<div class="dialog-header"><h2 id="item-title"></h2><form method="dialog"><button class="secondary" aria-label="Закрыть">×</button></form></div>
<section id="item-media" aria-label="Галерея мода" hidden>
<div id="gallery-content"></div>
<div id="gallery-controls" class="row" hidden>
<button id="gallery-prev" class="secondary">Назад</button>
<span id="gallery-position" class="meta" role="status"></span>
<button id="gallery-next" class="secondary">Дальше</button>
</div>
</section>
<p id="item-extras-status" class="status" role="status"></p>
<p id="item-meta" class="meta"></p>
<p id="item-description"></p>
<section id="requirements" hidden>
<h3>Зависимости</h3>
<ul id="required-items"></ul>
</section>
<div class="row"><button id="download">Скачать</button><a class="secondary button" id="steam-page" target="_blank" rel="noopener noreferrer">Страница в Steam</a></div>
<p id="item-download-notice" class="status" role="status"></p>
</dialog>
</body>
</html>
